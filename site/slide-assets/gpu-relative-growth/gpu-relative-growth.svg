   <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58646d" x="83.664" y="514.2384" transform="rotate(-0 83.664 514.2384)">Compute: dense BF16 / FP16 Tensor Core peak. Capacity and bandwidth are separate series.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58646d" x="83.664" y="531.9504" transform="rotate(-0 83.664 531.9504)">HBM and L2: per GPU. L1: combined L1 / shared-memory / texture pool per SM, not dedicated L1 cache.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58646d" x="83.664" y="549.6624" transform="rotate(-0 83.664 549.6624)">* B100: preliminary specs; L1 uses the Blackwell architecture value. Missing L2 data are not interpolated.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58646d" x="83.664" y="567.3744" transform="rotate(-0 83.664 567.3744)">Sources: NVIDIA product specifications, architecture/tuning guides and HGX reference architecture; see accompanying data and notes.</text>
  </g>
 </g>
